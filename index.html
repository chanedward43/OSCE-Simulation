<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unofficial 6-station OSCE practice for Year 7 medical students in Cambodia.">
<title>Year 7 OSCE Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Khmer:wght@400;600&display=swap">
<style>
/* Layout: each station is a "door card" like the instruction sheet posted outside a real OSCE room; a progress track shows the 6-station circuit. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#18252b; --muted:#5a6870; --line:#d5dcd9;
  --accent:#b8741a; --accent-soft:#f6ead8; --door:#1f4a52; --door-ink:#f2f6f5;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --bad:#b3262f; --bad-soft:#f8e2e3; --neu:#6b7280; --focus:#2458c6;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121719; --card:#1a2125; --ink:#e6ecee; --muted:#9aa8ae; --line:#2e383d;
  --accent:#e7a54a; --accent-soft:#3a2c18; --door:#163a41; --door-ink:#e9f1f0;
  --ok:#5fc08a; --ok-soft:#1b3125; --bad:#f07780; --bad-soft:#3b1e22; --neu:#9aa3ad; --focus:#7aa2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121719; --card:#1a2125; --ink:#e6ecee; --muted:#9aa8ae; --line:#2e383d;
  --accent:#e7a54a; --accent-soft:#3a2c18; --door:#163a41; --door-ink:#e9f1f0;
  --ok:#5fc08a; --ok-soft:#1b3125; --bad:#f07780; --bad-soft:#3b1e22; --neu:#9aa3ad; --focus:#7aa2ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:22px} h3{font-size:17px} h4{font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .okc{color:var(--ok)} .badc{color:var(--bad)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:hover{filter:brightness(1.08)}
.hero h1{font-size:clamp(34px,5vw,52px);margin-block:10px 12px}
.lede{font-size:17px;max-width:66ch;margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px}
.panel label{font-weight:600;font-size:13px;display:block}
.modecards{display:grid;gap:10px}
.modecard{text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:14px;cursor:pointer;display:grid;gap:4px}
.modecard span{font-size:13.5px;color:var(--muted)}
.modecard[aria-pressed="true"]{border-color:var(--door);box-shadow:inset 4px 0 0 var(--door)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.hist{display:grid;gap:6px}
.hist div{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
.about{display:grid;gap:12px}
.rules{margin:0;padding-left:18px;display:grid;gap:6px}
.bank{width:100%;border-collapse:collapse;font-size:13.5px}
.bank th{text-align:left;padding:7px 10px 7px 0;vertical-align:top;white-space:nowrap;border-bottom:1px solid var(--line)}
.bank td{padding:7px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-20px;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.progress{font:500 13px var(--f-mono);color:var(--muted)}
.timer{font:600 24px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.track{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.track span{font:500 12px var(--f-mono);padding:6px 10px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.track .done{background:var(--line);color:var(--ink)}
.track .now{background:var(--door);color:var(--door-ink);border-color:var(--door)}
.door{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.doorhead{background:var(--door);color:var(--door-ink);padding:18px 22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.doorhead h2{font-size:26px;color:var(--door-ink)}
.doorhead .eyebrow{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-radius:4px;border:1px solid currentColor;opacity:.9}
.candidate,.work,.door>.info,.door>.yours,.door>.model,.door>p,.door>h4,.door>.check,.door>.hint,.door>.src,.door>.qnav{margin-inline:22px}
.candidate{padding-block:18px 6px;border-bottom:1px dashed var(--line);display:grid;gap:10px}
.who{font-family:var(--f-display);font-size:19px;margin:0}
.stem{margin:0;max-width:72ch}
.task{background:var(--accent-soft);border-radius:6px;padding:10px 12px;margin:4px 0 12px}
.info{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.info p{margin:0;max-width:78ch}
.door>.info,.door>.yours{margin-block:14px}
.work{padding-block:16px}
.lbl{font-weight:600;font-size:14px;display:block;margin:0 0 8px;color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--f-body)}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);line-height:1.5;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.picks{border:0;margin:0 0 14px;padding:0;display:grid;gap:6px}
.pick{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pick:has(input:checked){border-color:var(--door);background:var(--bg)}
.pick input{margin-top:3px;accent-color:var(--door)}
.qnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-block:14px 20px}
.scorebox{background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;text-align:right;border:2px solid var(--line)}
.scorebox b{display:block;font:600 26px/1 var(--f-mono)}
.scorebox span{font-size:12px}
.scorebox.ok{border-color:var(--ok)} .scorebox.bad{border-color:var(--bad)}
.yours pre{white-space:pre-wrap;font:14px/1.5 var(--f-body);margin:0;max-height:220px;overflow:auto}
.check{padding-left:22px;display:grid;gap:6px;margin-block:8px}
.check li{padding:4px 0}
.check li{display:list-item}
.check li>span:first-child{display:inline}
.check .score{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
.check .score button{width:32px;height:30px;border:1px solid var(--line);border-radius:5px;background:transparent;cursor:pointer;font:600 13px var(--f-mono)}
.check .score button[aria-pressed="true"]{background:var(--door);color:var(--door-ink);border-color:var(--door)}
.check.ro li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.model{list-style:none;padding:0;display:grid;gap:6px;margin-block:14px}
.model li{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
.model li.chosen{box-shadow:inset 3px 0 0 var(--ink)}
.model .tag{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-right:8px;padding:2px 6px;border-radius:3px}
.model .ess .tag{background:var(--ok-soft);color:var(--ok)}
.model .use .tag{background:var(--ok-soft);color:var(--ok);opacity:.8}
.model .neu .tag{background:var(--bg);color:var(--neu)}
.model .bad .tag{background:var(--bad-soft);color:var(--bad)}
.model .why{font-size:12.5px;color:var(--bad);margin-top:4px}
.src{font-size:12.5px;color:var(--muted);margin-block:10px}
.table-wrap{overflow-x:auto;margin-top:16px}
.res{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.res th,.res td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.res td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font:600 12px var(--f-mono);padding:3px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.review{display:grid;gap:10px;margin-top:12px}
.rv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px 16px}
.rv.ok{border-left-color:var(--ok)} .rv.bad{border-left-color:var(--bad)}
.rv summary{cursor:pointer}
.rv .candidate{margin-inline:0}
.aibox{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin:14px 22px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.aibox p{margin:4px 0 0;max-width:78ch}
.aibox.done{border-color:var(--door);box-shadow:inset 4px 0 0 var(--door)}
.aibox.err{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.aibox.pending{justify-content:flex-start}
.rv .aibox{margin-inline:0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--door);flex:none;margin-top:2px}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .9s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.why2{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.check .score button:disabled{opacity:.4;cursor:wait}
.btn:disabled{opacity:.5;cursor:not-allowed}
.histrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px 12px;cursor:pointer}
.histrow:hover{border-color:var(--door)}
.histrow>span:first-child{display:grid;gap:2px;font-size:13.5px}
.histrow .muted{font-size:12px}
.hist{display:grid;gap:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--door);text-decoration:underline;cursor:pointer;font-size:13px;justify-self:start}
.about{margin-top:28px}
.check .itm{display:inline}
.check.ro li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.pts{font-family:var(--f-mono);white-space:nowrap}
.voice{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--bg);display:grid;gap:8px}
.vrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.vbtn{display:inline-flex;align-items:center;gap:8px}
.vbtn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.vlab{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.vlab select{min-width:150px;max-width:260px;padding:8px;font-weight:400}
.vmeter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.vmeter i{display:block;height:100%;width:0;background:var(--muted);transition:width .08s linear}
.vmeter i.live{background:var(--ok)}
.vmeter i.hot{background:var(--accent)}
.vinterim{margin:0;min-height:1.4em;font-style:italic;color:var(--muted);font-size:14px}
.voice .hint{margin:0}
@media (prefers-reduced-motion:reduce){.vmeter i{transition:none}}

/* Tablets and touch screens */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}
button{touch-action:manipulation}
@media (pointer:coarse){
  .btn{min-height:44px}
  .seg button{min-height:40px;padding-inline:14px}
  select{min-height:44px}
  .pick,.opt{min-height:48px}
  .pick input{width:20px;height:20px}
  .cell{height:44px;font-size:13px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
  .check .score button{width:44px;height:40px}
  .histrow{min-height:52px}
  .linkbtn{padding:8px 0}
  .modecard{padding:16px}
}
@media (hover:none){.opt:hover{border-color:var(--line)}.btn:hover{filter:none}}

footer{margin-top:40px;font-size:12.5px;color:var(--muted);max-width:80ch}
@media (max-width:820px){.cols{grid-template-columns:1fr}.doorhead h2{font-size:22px}.check .score{display:flex;margin:6px 0 0}}
@media (prefers-reduced-motion:no-preference){.pick,.modecard,.seg button{transition:background .15s,border-color .15s}}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const CASES=[
// ===== INTERNAL MEDICINE =====
{id:"med-tb",sp:"MED",title:"Chronic cough",who:"Mr Sokha, 45-year-old rice farmer",
stem:"You are the doctor in the outpatient department of a provincial referral hospital. Mr Sokha, 45, has come in with a cough.",
hx:{script:"\"I have been coughing for about 5 weeks. At first it was dry, now there is yellow sputum and last week I saw streaks of blood. I get fevers in the evening and wake up wet with sweat. I have lost about 6 kg in two months and I don't feel like eating. No chest pain, a little breathless when working in the field. I have never had TB treatment before. My older brother finished TB treatment last year. He lives in our house. I smoke 15 cigarettes a day for 20 years and drink rice wine at weekends. I have never had an HIV test. No diabetes that I know of. I don't take any medicines.\"",
list:["Introduces self, confirms identity, explains purpose, obtains consent","Duration and onset of the cough","Sputum: amount, colour, haemoptysis","Fever pattern and night sweats","Weight loss and appetite","Chest pain and breathlessness","Previous TB treatment (new vs retreatment case)","TB contact in the household","HIV risk factors and previous HIV testing","Diabetes and other comorbidities","Smoking and alcohol history","Occupation and living conditions","Summarises and gives a differential (TB, pneumonia, lung cancer)"]},
hxSum:"Cough for 5 weeks with blood-streaked sputum, evening fevers, night sweats, 6 kg weight loss. Brother in the same house treated for TB last year. Smoker 20 years. Never tested for HIV. No previous TB treatment.",
ex:{list:["Hand hygiene, introduction, consent, adequate exposure and chaperone offered","General inspection: wasting, pallor, cyanosis, clubbing","Vital signs including temperature, SpO₂, respiratory rate","Weight and BMI","Cervical and supraclavicular lymph nodes","Inspects the mouth (oral thrush) and skin","Chest inspection and chest expansion","Percussion comparing both sides","Auscultation, including breath sounds and added sounds","Thanks patient and summarises findings"],
find:"Thin and tired. Temp 38.0 °C, HR 98, RR 22, SpO₂ 95% on air, BP 112/70. Weight 46 kg, BMI 17. Oral thrush present. No clubbing, no lymphadenopathy. Dull percussion with bronchial breathing and crackles over the right upper zone."},
inv:{opts:[["Sputum Xpert MTB/RIF (rapid molecular test)",2],["Chest X-ray",2],["HIV test with counselling",2],["Blood glucose or HbA1c",1],["Full blood count",1],["Baseline liver function tests",1],["Tuberculin skin test to diagnose active TB",0],["CT thorax as first-line test",0],["Serum TB antibody (serology) test",-1]],
res:"Xpert: MTB detected, rifampicin resistance NOT detected. CXR: right upper lobe cavitation with patchy infiltrates. HIV rapid tests: positive (confirmed on second test). Fasting glucose 6.1 mmol/L. Hb 10.8 g/dL. ALT 32 U/L."},
dx:{opts:["Rifampicin-sensitive pulmonary TB with HIV co-infection","Community-acquired pneumonia","Lung cancer","Multidrug-resistant TB","Pneumocystis pneumonia"],a:0,
just:[["Cough over 2 weeks with haemoptysis",1],["Night sweats, fever and weight loss",1],["Household TB contact",1],["Xpert MTB detected, rifampicin resistance not detected",1],["Upper-lobe cavitation on CXR",1],["Positive HIV test and oral thrush",1],["Normal SpO₂ rules out TB",0],["Rifampicin resistance detected",0],["Short history under one week",0]]},
dxName:"Rifampicin-sensitive pulmonary TB with newly diagnosed HIV infection",
tx:{opts:[["Start 2HRZE/4HR fixed-dose combination by body weight",2],["Start ART (TLD) within 2 weeks of starting TB treatment",2],["Increase dolutegravir to 50 mg twice daily while on rifampicin",1],["Co-trimoxazole preventive therapy",2],["Pyridoxine with isoniazid",1],["Notify the national TB programme (CENAT) and screen household contacts",2],["Treatment support / directly observed therapy",1],["Isoniazid and rifampicin only, from day 1",-2,"Two drugs in the intensive phase cause treatment failure and resistance"],["Two-week trial of a fluoroquinolone before deciding",-1],["Delay ART until TB treatment is completed",0]]},
plan:"6 months of first-line TB treatment, ART started within 2 weeks, co-trimoxazole, contact screening.",
edu:{list:["Explains TB and HIV in plain language and checks what he already knows","TB is curable with 6 months of daily treatment","Do not stop when you feel better; what to do if doses are missed","Expected side effects (orange urine) and ones to report (yellow eyes, vision change, rash)","Cover cough, open windows, sleep apart at first; not infectious after 2 weeks of treatment","Household members to be screened; young children get preventive treatment","HIV is a lifelong condition controlled by daily ART; importance of adherence","Partner testing and safer sex","Nutrition, stop smoking and alcohol","Follow-up visits and sputum checks at 2, 5 and 6 months","Checks understanding (teach-back) and invites questions"]},
refs:"WHO consolidated TB guidelines Module 4 (2022); WHO consolidated HIV guidelines (2021); Cambodia CENAT National TB guidelines"},

{id:"med-stemi",sp:"MED",title:"Acute chest pain",who:"Mr Vannak, 58-year-old shop owner",
stem:"You are the doctor in the emergency department of a provincial referral hospital. Mr Vannak, 58, has arrived with chest pain that started less than an hour ago.",
hx:{script:"\"The pain started about 50 minutes ago while I was sitting watching TV. It is in the middle of my chest, like a heavy weight pressing, 8 out of 10. It goes to my left arm and jaw. I am sweating and I feel like vomiting. I have never had pain like this. I have high blood pressure and take amlodipine, but I often forget. I smoke a pack a day for 30 years. My father died of a heart attack at 60. I have never had a stroke, bleeding problems or recent surgery. No allergies.\"",
list:["Introduces self, consent, recognises urgency","Site and character of pain","Onset, timing and duration","Radiation","Severity","Associated sweating, nausea, breathlessness, palpitations, syncope","Previous similar episodes or known angina","Cardiovascular risk factors: hypertension, diabetes, smoking, lipids, family history","Current medication and allergies","Contraindications to thrombolysis: stroke, bleeding, recent surgery or trauma","Asks about tearing pain to the back (aortic dissection)","Summarises and acts urgently"]},
hxSum:"Central crushing chest pain for 50 minutes radiating to the left arm and jaw, with sweating and nausea. Poorly controlled hypertension, heavy smoker, father had MI at 60. No bleeding risk, stroke or recent surgery.",
ex:{list:["Hand hygiene, introduction, consent","General: distress, sweating, pallor","Pulse rate and rhythm","Blood pressure in both arms","SpO₂ and respiratory rate","JVP","Heart sounds and murmurs","Chest auscultation for crackles","Peripheral oedema and peripheral pulses","Signs of shock: capillary refill, cold peripheries, conscious level","Summarises findings"],
find:"Sweaty and anxious. HR 96 regular, BP 150/90 right arm and 148/88 left arm, RR 20, SpO₂ 96% on air. JVP not raised. Heart sounds normal, no murmur. Chest clear. No oedema. Peripheral pulses present and equal."},
inv:{opts:[["12-lead ECG within 10 minutes of arrival",2],["High-sensitivity troponin",1],["FBC, electrolytes, creatinine, glucose, lipids",1],["Chest X-ray (not delaying reperfusion)",1],["Exercise stress test now",-2,"Stress testing during an acute MI is dangerous"],["D-dimer",0],["CT coronary angiography now",0]],
res:"ECG: sinus rhythm 96/min, ST elevation 3 mm in V1–V5 with reciprocal ST depression in II, III, aVF. Troponin raised. Glucose 7.8 mmol/L, creatinine 88 µmol/L, K⁺ 4.1. CXR: normal mediastinum, clear lungs."},
dx:{opts:["Acute anterior ST-elevation myocardial infarction","Non-ST-elevation myocardial infarction","Acute pericarditis","Acute aortic dissection","Stable angina"],a:0,
just:[["Ischaemic chest pain lasting over 20 minutes",1],["ST elevation in contiguous anterior leads V1–V5",1],["Reciprocal ST depression in inferior leads",1],["Several cardiovascular risk factors",1],["Equal BP in both arms and normal mediastinum make dissection less likely",1],["Diffuse concave ST elevation with PR depression",0],["Pain eased by leaning forward",0],["Normal ECG",0]]},
dxName:"Acute anterior STEMI",

const STOPW=new Set(("a an the and or of to for in on with by at as is are be from about any other this that their his her its your you they patient patients client mother father parent child including e g eg if it into vs per each what how when who why "+
 "does do did has have had will would should can could may might must not no yes than then there these those which while within without after before during over under up down out off only also very more most less such same so too just using use uses used "+
 "gives give gets get takes take makes make asks ask checks check notes note looks look performs perform obtains obtain states state offers offer").split(" "));

function normText(t){return " "+String(t||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'%.₂ ]+/g," ").replace(/₂/g,"2").replace(/\s+/g," ").trim()+" "}
function phraseIn(T,p){p=p.toLowerCase();return p.length<=3?T.includes(" "+p+" "):T.includes(" "+p)}
function stemOf(w){return w.length>=6?w.slice(0,5):w}
function synFor(w){const out=[];for(const k in SYN){if(w.startsWith(k)||(w.length>=4&&k.startsWith(w)))out.push(...SYN[k])}return out}

function concepts(item,topic){
  const groups=[];let rest=item.replace(/\(([^)]*)\)/g,(_,inner)=>{groups.push({opt:true,alts:inner.split(/,|\/| or /).map(s=>s.trim()).filter(Boolean)});return " "});
  rest.split(/,|;| and |\/|:| vs |\. /).map(s=>s.trim()).filter(Boolean).forEach(cl=>{
    const words=cl.toLowerCase().replace(/[^a-z0-9₂' ]/g," ").split(/\s+/).filter(w=>w&&(w.length>=3||SYN[w])&&!STOPW.has(w)&&!topic.has(stemOf(w)));
    if(words.length)groups.push({words});
  });
  return groups;
}
function conceptHit(T,g){
  if(g.alts){for(const a of g.alts){const an=a.toLowerCase();if(phraseIn(T,an))return a;const ws=an.split(/\s+/).filter(w=>w.length>=4&&!STOPW.has(w));for(const w of ws){if(phraseIn(T,stemOf(w)))return w}}return null}
  for(const w of g.words){
    if(phraseIn(T,w.length<=3?w:stemOf(w)))return w;
    for(const p of synFor(w)){if(phraseIn(T,p))return p}
  }
  return null;
}
function keywordMark(c,type,text){
  const T=normText(text);
  const topic=new Set(normText(c.title).trim().split(" ").filter(w=>w.length>=4).map(stemOf));
  return c[type].list.map(item=>{
    const gs=concepts(item,topic);if(!gs.length)return{score:0,found:[]};
    const found=[];let m=0,n=0;gs.forEach(g=>{const h=conceptHit(T,g);if(!g.opt)n++;if(h){m++;found.push(h)}});
    if(!n)n=1;m=Math.min(m,n);const r=m/n;const score=!T.trim()?0:(r>=0.6||(n===1&&m===1))?2:m>=1?1:0;
    return{score,found:[...new Set(found)].slice(0,4)};
  });
}

function makeStation(caseId,type){
  const c=caseById(caseId),st={caseId,type};
  if(type==="inv")st.ord=shuffle(c.inv.opts.map((_,i)=>i));
  if(type==="tx")st.ord=shuffle(c.tx.opts.map((_,i)=>i));
  if(type==="dx"){st.dord=shuffle(c.dx.opts.map((_,i)=>i));st.jord=shuffle(c.dx.just.map((_,i)=>i));}
  return st;
}
function fullExam(){
  const bySpec={};CASES.forEach(c=>(bySpec[c.sp]=bySpec[c.sp]||[]).push(c.id));
  let picks=Object.keys(SPEC).map(k=>shuffle(bySpec[k])[0]);
  picks=picks.concat(shuffle(CASES.map(c=>c.id).filter(id=>!picks.includes(id))).slice(0,2));
  picks=shuffle(picks);
  return TYPES.map((t,i)=>makeStation(picks[i],t.k));
}
function caseRun(id){return TYPES.map(t=>makeStation(id,t.k))}

/* ---------- scoring (works on the live attempt or a saved one: R = {stations, ans, marks}) ---------- */
function pickScore(opts,sel){
  const max=opts.reduce((s,o)=>s+(o[1]>0?o[1]:0),0);let sc=0,crit=[];
  (sel||[]).forEach(i=>{const v=opts[i][1];if(v>0)sc+=v;else if(v===0)sc-=0.5;else{sc+=v;if(v<=-2)crit.push(opts[i])}});
  return{pct:Math.max(0,Math.min(1,sc/max)),crit};
}
function scoreStation(R,j){
  const st=R.stations[j],c=caseById(st.caseId),a=R.ans[j]||{};
  if(TN[st.type].self){const list=c[st.type].list,m=R.marks[j]||{};return{pct:list.reduce((s,_,i)=>s+(m[i]||0),0)/(list.length*2),crit:[]}}
  if(st.type==="inv")return pickScore(c.inv.opts,a.sel);
  if(st.type==="tx")return pickScore(c.tx.opts,a.sel);
  const ok=c.dx.just.filter(x=>x[1]).length,per=12/ok;let js=0;
  (a.just||[]).forEach(i=>{js+=c.dx.just[i][1]?per:-per});
  return{pct:((a.dx===c.dx.a?8:0)+Math.max(0,Math.min(12,js)))/20,crit:[]};
}
const pass=r=>r.pct>=0.75&&!r.crit.length;
function overall(R){
  const rs=R.stations.map((_,j)=>scoreStation(R,j));
  const passed=rs.filter(pass).length, fails=rs.filter(r=>!pass(r));
  const ok=passed===6||(passed===5&&fails[0].pct>=0.6&&!fails[0].crit.length);
  return{rs,passed,ok,pct:Math.round(rs.reduce((s,r)=>s+r.pct,0)/6*100)};
}

function autoMark(j){
  const st=S.stations[j],c=caseById(st.caseId),text=(S.ans[j]||{}).notes||"";
  const items=keywordMark(c,st.type,text);
  S.auto[j]={items};S.marks[j]=Object.fromEntries(items.map((x,i)=>[i,x.score]));
}

async function listMics(){

function vStatus(t){const s=document.getElementById("v-status");if(s)s.textContent=t}

function meterLoop(an,buf){
  an.getByteTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
  const lvl=Math.min(100,Math.round(Math.sqrt(sum/buf.length)*320));
  const m=document.getElementById("v-meter"),w=document.getElementById("v-meterwrap");
  if(m){m.style.width=lvl+"%";m.className=lvl>85?"hot":lvl>8?"live":"";}
  if(w)w.setAttribute("aria-valuenow",lvl);
  V.raf=requestAnimationFrame(()=>meterLoop(an,buf));
}

function appendText(text){

async function startVoice(){
  if(!SR){vStatus("Voice typing isn't supported in this browser. Use Chrome or Edge, or type your answer.");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){vStatus("Microphone access isn't available here. Open the website in Chrome or Edge over https.");return}
  try{
    V.stream=await navigator.mediaDevices.getUserMedia({audio:V.dev?{deviceId:{exact:V.dev}}:true});
  }catch(e){
    vStatus(e&&e.name==="NotAllowedError"?"Microphone access was blocked. Allow the microphone in your browser's site settings, then try again. (Voice typing doesn't work inside the claude.ai preview; use the website version.)":e&&e.name==="OverconstrainedError"?"That microphone isn't available. Choose another one.":"Couldn't start the microphone. Check it's connected and not used by another app.");
    return;
  }

  try{const AC=window.AudioContext||window.webkitAudioContext;V.ctx=new AC();if(V.ctx.state==='suspended'){try{await V.ctx.resume()}catch(e){}}const src=V.ctx.createMediaStreamSource(V.stream);const an=V.ctx.createAnalyser();an.fftSize=1024;src.connect(an);meterLoop(an,new Uint8Array(an.fftSize))}catch(e){}

    const el=document.getElementById("v-interim");if(el)el.textContent=interim};
  rec.onerror=ev=>{

    const msg={"not-allowed":"Microphone or speech service was blocked. Allow it in your browser settings.","service-not-allowed":"The browser's speech service is blocked here. Try Chrome or Edge.","language-not-supported":"This browser can't recognise "+(V.lang==="km-KH"?"Khmer":"this language")+". Try Chrome, or switch language.","network":"Voice typing needs an internet connection.","audio-capture":"No microphone found."}[ev.error]||("Voice typing stopped ("+ev.error+").");
    vStatus(msg);if(["not-allowed","service-not-allowed","language-not-supported","audio-capture"].includes(ev.error))stopVoice(true);
  };

  V.rec=rec;V.on=true;

function startRec(rec){

  if(S.mode==="exam")S.stations=fullExam();
  else{const pool=CASES.filter(c=>S.spec==="ALL"||c.sp===S.spec);const id=S.caseId||shuffle(pool)[0].id;S.stations=caseRun(id)}
  S.screen="station";S.idx=0;S.phase="task";S.left=S.mins*60;S.done=false;save();render();window.scrollTo({top:0});
}

function fmt(s){s=Math.max(0,s|0);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

function briefing(c,type){
  const parts=[`<p class="stem">${esc(c.stem)}</p>`];
  const ti=TYPES.findIndex(t=>t.k===type);
  if(ti>=1)parts.push(`<div class="info"><h4>History</h4><p>${esc(c.hxSum)}</p></div>`);
  if(ti>=2)parts.push(`<div class="info"><h4>Examination findings</h4><p>${esc(c.ex.find)}</p></div>`);
  if(ti===3||ti===4)parts.push(`<div class="info"><h4>Investigation results</h4><p>${esc(c.inv.res)}</p></div>`);
  if(ti>=4)parts.push(`<div class="info"><h4>Diagnosis</h4><p>${esc(c.dxName)}</p></div>`);
  if(ti===5)parts.push(`<div class="info"><h4>Agreed plan</h4><p>${esc(c.plan)}</p></div>`);
  return parts.join("");
}

function renderStation(){
  const j=S.idx,st=S.stations[j],c=caseById(st.caseId),T=TN[st.type],a=S.ans[j]||(S.ans[j]={});
  const timed=S.mins>0;
  let body="";
  if(T.self){
    body=`<label for="notes" class="lbl">${st.type==="hx"?"Your questions":st.type==="ex"?"Your examination steps":"What you would say"}</label>
    ${voicePanel()}
    <textarea id="notes" rows="12" placeholder="${st.type==="hx"?"e.g. Hello, I'm Dr …, can I confirm your name? Is it OK if I ask you some questions? What brought you in today? When did it start?":st.type==="ex"?"e.g. Wash hands, introduce myself, get consent, expose the chest… Check vital signs: pulse, BP, RR, SpO2, temperature…":"e.g. I'd like to explain what we found… Do you have any questions?"}">${esc(a.notes||"")}</textarea>
    <p class="hint">${st.type==="hx"?"In the real station a simulated patient answers you. Here, write your questions; the patient's answers appear at marking. ":""}Marked by keyword matching: be specific and write it the way you would say it.</p>`;
  } else if(st.type==="inv"||st.type==="tx"){
    const opts=c[st.type].opts,sel=new Set(a.sel||[]);
    body=`<fieldset class="picks"><legend class="lbl">${st.type==="inv"?"Request":"Do now"}</legend>${st.ord.map(i=>`<label class="pick"><input type="checkbox" id="p-${i}" data-i="${i}" ${sel.has(i)?"checked":""}><span>${esc(opts[i][0])}</span></label>`).join("")}</fieldset>`;
  } else {
    const js=new Set(a.just||[]);
    body=`<fieldset class="picks"><legend class="lbl">Most likely diagnosis (8 marks)</legend>${st.dord.map(i=>`<label class="pick"><input type="radio" name="dx" id="d-${i}" data-i="${i}" ${a.dx===i?"checked":""}><span>${esc(c.dx.opts[i])}</span></label>`).join("")}</fieldset>
    <fieldset class="picks"><legend class="lbl">Findings that justify it (12 marks; wrong choices lose marks)</legend>${st.jord.map(i=>`<label class="pick"><input type="checkbox" id="j-${i}" data-i="${i}" ${js.has(i)?"checked":""}><span>${esc(c.dx.just[i][0])}</span></label>`).join("")}</fieldset>`;
  }
  app.innerHTML=`
  <div class="topbar">
    <div class="progress">${S.mode==="exam"?"Full OSCE circuit":"Case practice"} · station ${j+1} of 6</div>
    ${timed?`<div class="timer" id="timer">${fmt(S.left)}</div>`:`<div class="timer">untimed</div>`}
    <button class="btn ghost" id="quit">Save & exit</button>
  </div>
  <div class="track">${S.stations.map((s,k)=>`<span class="${k<j?"done":k===j?"now":""}">${k+1}. ${esc(TN[s.type].n)}</span>`).join("")}</div>
  <article class="door">
    <div class="doorhead">
      <div><div class="eyebrow">Station ${j+1}</div><h2>${esc(T.n)}</h2></div>
      <div class="chips"><span class="chip">${esc(SPEC[c.sp])}</span><span class="chip">${esc(c.title)}</span></div>
    </div>
    <div class="candidate"><h4>Candidate instructions</h4><p class="who">${esc(c.who)}</p>${briefing(c,st.type)}<p class="task"><b>Your task:</b> ${esc(T.task)}</p></div>
    <div class="work">${body}</div>
    <div class="qnav"><span class="muted" id="warn">${timed?"The station ends automatically when time runs out.":""}</span><button class="btn" id="finish">${S.mode==="exam"?(j===5?"Finish the circuit":"Finish station, move on"):"Finish station and mark it"}</button></div>
  </article>`;
  const n=document.getElementById("notes");if(n)n.oninput=()=>{a.notes=n.value;delete S.auto[j];save()};
  if(T.self)voiceInit(j);
  document.querySelectorAll("input[id^=p-]").forEach(x=>x.onchange=()=>{a.sel=[...document.querySelectorAll("input[id^=p-]:checked")].map(e=>+e.dataset.i);save()});
  document.querySelectorAll("input[name=dx]").forEach(x=>x.onchange=()=>{a.dx=+x.dataset.i;save()});
  document.querySelectorAll("input[id^=j-]").forEach(x=>x.onchange=()=>{a.just=[...document.querySelectorAll("input[id^=j-]:checked")].map(e=>+e.dataset.i);save()});
  document.getElementById("finish").onclick=endStation;
  document.getElementById("quit").onclick=()=>{clearInterval(tick);S.screen="start";save();render()};
  clearInterval(tick);
  if(timed)tick=setInterval(()=>{S.left--;const t=document.getElementById("timer");if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<=60)}
    if(S.left===60){const w=document.getElementById("warn");if(w)w.textContent="One minute remaining."}
    if(S.left%5===0)save();if(S.left<=0)endStation()},1000);
}

function endStation(){
  clearInterval(tick);
  if(S.mode==="case"){S.markIdx=S.idx;if(TN[S.stations[S.idx].type].self&&!S.auto[S.idx])autoMark(S.idx);S.screen="marking";S.phase="marking";save();render();window.scrollTo({top:0});return}
  if(S.idx<5){S.idx++;S.left=S.mins*60;save();render();window.scrollTo({top:0});return}
  S.markQueue=S.stations.map((s,k)=>TN[s.type].self?k:-1).filter(k=>k>=0);
  S.markQueue.forEach(k=>{if(!S.auto[k])autoMark(k)});
  S.markIdx=S.markQueue[0];S.screen="marking";S.phase="marking";save();render();window.scrollTo({top:0});
}

function modelBlock(R,j){
  const st=R.stations[j],c=caseById(st.caseId),a=R.ans[j]||{};
  if(st.type==="inv"||st.type==="tx"){
    const opts=c[st.type].opts,sel=new Set(a.sel||[]);
    return `<ul class="model">${st.ord.map(i=>{const[t,v,why]=opts[i];const cls=v>=2?"ess":v===1?"use":v===0?"neu":"bad";
      return `<li class="${cls} ${sel.has(i)?"chosen":""}"><span class="tag">${v>=2?"Essential":v===1?"Useful":v===0?"Not indicated":v<=-2?"Critical error":"Harmful"}</span>${esc(t)}${sel.has(i)?" <i>(you chose)</i>":""}${why?`<div class="why">${esc(why)}</div>`:""}</li>`}).join("")}</ul>
      ${st.type==="inv"?`<div class="info"><h4>Results</h4><p>${esc(c.inv.res)}</p></div>`:""}`;
  }
  if(st.type==="dx"){
    const js=new Set(a.just||[]);
    return `<p><b>Correct diagnosis:</b> ${esc(c.dx.opts[c.dx.a])}. ${a.dx===c.dx.a?"<span class='okc'>You got it.</span>":`<span class='badc'>You chose: ${esc(a.dx!=null?c.dx.opts[a.dx]:"nothing")}.</span>`}</p>
    <ul class="model">${st.jord.map(i=>{const[t,ok]=c.dx.just[i];return `<li class="${ok?"ess":"bad"} ${js.has(i)?"chosen":""}"><span class="tag">${ok?"Supports":"Does not fit"}</span>${esc(t)}${js.has(i)?" <i>(you chose)</i>":""}</li>`}).join("")}</ul>`;
  }
  return "";
}

function checklistBlock(R,j,editable){
  const st=R.stations[j],c=caseById(st.caseId),m=R.marks[j]||{},au=(R.auto||{})[j];
  return `<ol class="check${editable?"":" ro"}">${c[st.type].list.map((t,i)=>{
    const it=au&&au.items[i],edited=it&&m[i]!==it.score;
    const ev=it?(it.found.length?`Found: “${it.found.map(esc).join("”, “")}”`:"No matching words found"):"";
    return `<li><span class="itm">${esc(t)}${ev?`<span class="why2">${ev}${edited?` · changed from ${it.score}`:""}</span>`:""}</span>${editable?`<span class="score" role="group" aria-label="Score for item ${i+1}">${[0,1,2].map(v=>`<button id="m-${i}-${v}" aria-pressed="${m[i]===v}" data-i="${i}" data-v="${v}" title="${["Not done","Partly done","Done well"][v]}">${v}</button>`).join("")}</span>`:`<b class="pts">${m[i]??0}/2</b>`}</li>`}).join("")}</ol>`;
}

function renderMarking(){
  const j=S.markIdx,st=S.stations[j],c=caseById(st.caseId),T=TN[st.type],a=S.ans[j]||{};
  const last=S.mode==="case"?j===5:S.markQueue.indexOf(j)===S.markQueue.length-1;
  let inner="";
  if(T.self){
    inner=`<div class="aibox"><div><b>Marked automatically by keyword matching</b><p>Each checklist item was scored from the words in your answer. Keyword marking can miss unusual wording or give credit too easily, so check every mark against your answer and change any that are wrong.</p></div></div>
    ${st.type==="hx"?`<div class="info"><h4>What the patient would have told you</h4><p>${esc(c.hx.script)}</p></div>`:""}
    ${st.type==="ex"?`<div class="info"><h4>Examination findings</h4><p>${esc(c.ex.find)}</p></div>`:""}
    <div class="yours"><h4>Your answer</h4><pre>${esc(a.notes||"(nothing written)")}</pre></div>
    <h4 class="lbl">Examiner checklist</h4>${checklistBlock(S,j,true)}
    <p class="hint">0 = not done · 1 = partly done or incomplete · 2 = done well</p>`;
  } else inner=modelBlock(S,j);
  const r=scoreStation(S,j);
  app.innerHTML=`
  <div class="topbar"><div class="progress">${S.mode==="exam"?"Check the marking":"Case practice"} · station ${j+1}: ${esc(T.n)}</div><div></div><button class="btn ghost" id="quit">Save & exit</button></div>
  <article class="door">
    <div class="doorhead"><div><div class="eyebrow">Marking · ${esc(SPEC[c.sp])} · ${esc(c.title)}</div><h2>${esc(T.n)}</h2></div>
      <div class="scorebox ${pass(r)?"ok":"bad"}"><b>${Math.round(r.pct*100)}%</b><span>${pass(r)?"Pass":"Fail"}${r.crit.length?" · critical error":""}</span></div></div>
    ${inner}
    <div class="src">Guideline basis: ${esc(c.refs)}</div>
    <div class="qnav"><span class="muted">${S.mode==="exam"?`Written station ${S.markQueue.indexOf(j)+1} of ${S.markQueue.length}`:""}</span><button class="btn" id="next">${last?"See results":S.mode==="case"?"Next station":"Next written station"}</button></div>
  </article>`;
  document.querySelectorAll(".score button").forEach(b=>b.onclick=()=>{(S.marks[j]=S.marks[j]||{})[+b.dataset.i]=+b.dataset.v;save();renderMarking()});
  document.getElementById("quit").onclick=()=>{S.screen="start";save();render()};
  document.getElementById("next").onclick=()=>{
    if(S.mode==="case"){ if(j===5)return finish(); S.idx=j+1;S.left=S.mins*60;S.screen="station";S.phase="task";save();render();window.scrollTo({top:0});return}
    const q=S.markQueue,k=q.indexOf(j); if(k===q.length-1)return finish(); S.markIdx=q[k+1];save();render();window.scrollTo({top:0});
  };
}

function finish(){
  const o=overall(S),d=new Date();
  const label=S.mode==="exam"?"Full OSCE circuit":"Case: "+caseById(S.stations[0].caseId).title;
  const snap={id:String(Date.now()),label,date:d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}),pass:o.ok,pct:o.pct,mode:S.mode,mins:S.mins,
    stations:S.stations,ans:S.ans,marks:S.marks,auto:S.auto};
  HIST=HIST.concat([snap]).slice(-HMAX);
  if(!saveHist(HIST)){HIST=HIST.slice(-5);saveHist(HIST)}
  S.lastId=snap.id;S.done=true;S.screen="results";S.phase="results";save();render();window.scrollTo({top:0});
}

function renderResults(R,isSaved){
  const o=overall(R);
  app.innerHTML=`
  <div class="eyebrow">${isSaved?`Saved attempt · ${esc(R.date)}`:"Results"} · ${esc(R.mode==="exam"?"Full OSCE circuit":"Case practice")}</div>
  <h1 class="${o.ok?"okc":"badc"}" style="font-size:clamp(32px,5vw,48px);margin:6px 0">${o.ok?"Pass":"Not yet a pass"}</h1>
  <p class="muted">${o.passed} of 6 stations passed · average ${o.pct}%. Rule: pass all 6, or 5 plus at least 60% on the sixth, with no critical error on it.${isSaved?"":" This attempt is saved under Recent attempts."}</p>
  <div class="table-wrap"><table class="res"><thead><tr><th>#</th><th>Station</th><th>Case</th><th>Score</th><th>Result</th></tr></thead><tbody>
  ${R.stations.map((st,j)=>{const c=caseById(st.caseId),r=o.rs[j];return `<tr><td>${j+1}</td><td>${esc(TN[st.type].n)}</td><td>${esc(SPEC[c.sp])}: ${esc(c.title)}</td><td class="n">${Math.round(r.pct*100)}%</td><td><span class="pill ${pass(r)?"ok":"bad"}">${pass(r)?"Pass":"Fail"}${r.crit.length?" · critical":""}</span></td></tr>`}).join("")}
  </tbody></table></div>
  <h2 style="margin-top:28px">Station review</h2>
  <div class="actions"><button class="linkbtn" id="openall">Expand all stations</button></div>
  <div class="review">${R.stations.map((st,j)=>{const c=caseById(st.caseId),T=TN[st.type],r=o.rs[j];
    const body=T.self?`<div class="yours"><h4>What you wrote</h4><pre>${esc((R.ans[j]||{}).notes||"(nothing written)")}</pre></div>${checklistBlock(R,j,false)}`:modelBlock(R,j);
    return `<details class="rv ${pass(r)?"ok":"bad"}"><summary><b>Station ${j+1} · ${esc(T.n)}</b> <span class="muted">${esc(c.title)} · ${Math.round(r.pct*100)}%</span></summary>
      <div class="candidate"><p class="who">${esc(c.who)}</p>${briefing(c,st.type)}</div>${body}
      ${r.crit.length?`<p class="badc"><b>Critical error:</b> ${r.crit.map(x=>esc(x[0])+(x[2]?" ("+esc(x[2])+")":"")).join("; ")}</p>`:""}
      <div class="src">Guideline basis: ${esc(c.refs)}</div></details>`}).join("")}</div>
  <div class="actions" style="margin-top:20px">${isSaved?"":`<button class="btn" id="again">${R.mode==="exam"?"New circuit":"Another case"}</button>`}<button class="btn ${isSaved?"":"ghost"}" id="home">Back to start</button></div>
  <footer>Unofficial revision tool. Check anything that looks wrong against the cited guideline and Cambodian national protocols.</footer>`;
  const oa=document.getElementById("openall");if(oa)oa.onclick=()=>{const all=[...document.querySelectorAll("details.rv")];const open=!all.every(d=>d.open);all.forEach(d=>d.open=open);oa.textContent=open?"Collapse all stations":"Expand all stations"};
  const ag=document.getElementById("again");if(ag)ag.onclick=start;
  document.getElementById("home").onclick=()=>{S.screen="start";S.reviewId=null;save();render();window.scrollTo({top:0})};
}

if((S.screen==="station"||S.screen==="marking"||S.screen==="results")&&!S.stations.length)S.screen="start";
render();
</script>
</body>
</html>
